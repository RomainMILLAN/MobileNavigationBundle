name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

# Least privilege: the workflow only reads the repository. Never pull_request_target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    name: PHP ${{ matrix.php }} · Symfony ${{ matrix.symfony }} · UX ${{ matrix.ux }} · ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # UX 3 requires PHP >= 8.4 and Symfony >= 7.4: both series are tested. The lowest
        # job keeps the dev floor (^6.4.24): older 6.4 test tooling breaks on Twig >= 3.27.
        include:
          - { php: '8.2', symfony: '^6.4.24', ux: '^2.25.2', dependencies: lowest }
          - { php: '8.3', symfony: '7.4.*', ux: '^2.25.2', dependencies: highest }
          - { php: '8.4', symfony: '7.4.*', ux: '^3.0', dependencies: highest }
          - { php: '8.5', symfony: '8.0.*', ux: '^3.0', dependencies: highest }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Pin the Symfony and UX versions of this job
        run: |
          composer require --no-update "symfony/ux-twig-component:${{ matrix.ux }}" "symfony/stimulus-bundle:${{ matrix.ux == '^3.0' && '^3.0' || '^2.20' }}"
          for package in browser-kit css-selector dom-crawler filesystem framework-bundle runtime translation twig-bridge twig-bundle; do
            composer require --dev --no-update "symfony/$package:${{ matrix.symfony }}"
          done
      - name: Install dependencies (${{ matrix.dependencies }})
        run: composer update --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      - name: Audit dependencies
        run: composer audit
      - name: Tests
        run: vendor/bin/phpunit

  php-quality:
    name: Static analysis & style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: pcov
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - name: Install the isolated tools
        run: for tool in phpstan php-cs-fixer rector deptrac infection; do composer install --no-interaction --no-progress --working-dir=tools/$tool; done
      - run: tools/php-cs-fixer/vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes
      - run: tools/phpstan/vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: tools/rector/vendor/bin/rector process --dry-run --no-progress-bar
      - run: tools/deptrac/vendor/bin/deptrac analyse --no-progress
      - name: Mutation testing (src/Model + src/Twig)
        run: tools/infection/vendor/bin/infection --threads=max --no-progress --min-msi=80 --min-covered-msi=80

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn npm audit --all --recursive --severity high
      - run: yarn typecheck
      - run: yarn test
      - name: The committed dist/ is exactly what the sources build
        run: yarn build && git diff --exit-code -- dist
